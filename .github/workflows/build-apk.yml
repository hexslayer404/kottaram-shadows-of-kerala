name: Build Kottaram APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.3.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  ZIP_FILE: "stitch_kottaram_shadows_of_kerala.zip"

jobs:
  build:
    name: Build Kottaram Android APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v7


      # =========================================================
      # 2. JAVA 17
      # =========================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # =========================================================
      # 3. ANDROID SDK COMMAND LINE TOOLS
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools"
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"


      # =========================================================
      # 4. INSTALL REQUIRED SDK COMPONENTS
      # =========================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking sdkmanager..."
          command -v sdkmanager
          sdkmanager --version

          echo
          echo "Installing Android SDK components..."

          sdkmanager \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo
          echo "SDK installation completed."


      # =========================================================
      # 5. VERIFY TOOLCHAIN
      # =========================================================
      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "========== JAVA =========="
          java --version

          echo
          echo "========== SDKMANAGER =========="
          sdkmanager --version

          echo
          echo "========== ADB =========="
          adb --version

          echo
          echo "========== ANDROID SDK =========="
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"


      # =========================================================
      # 6. VERIFY ZIP
      # =========================================================
      - name: Verify Stitch ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository root:"
          ls -lah

          if [ ! -f "${ZIP_FILE}" ]; then
            echo
            echo "ERROR: ${ZIP_FILE} was not found."
            echo
            echo "Available files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo
          echo "ZIP FOUND:"
          ls -lh "${ZIP_FILE}"

          echo
          echo "ZIP CONTENT:"
          unzip -l "${ZIP_FILE}"


      # =========================================================
      # 7. EXTRACT STITCH ZIP
      # =========================================================
      - name: Extract Stitch project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _stitch
          mkdir -p _stitch

          unzip -q "${ZIP_FILE}" -d _stitch

          echo
          echo "Searching for Stitch screens..."

          FIRST_HTML="$(
            find _stitch \
              -type f \
              -name 'code.html' \
              -print \
            | head -n 1
          )"

          if [ -z "${FIRST_HTML}" ]; then
            echo
            echo "ERROR: No code.html found inside ZIP."
            find _stitch -type f | sort
            exit 1
          fi

          STITCH_ROOT="$(
            dirname \
              "$(dirname "${FIRST_HTML}")"
          )"

          echo
          echo "Detected Stitch root:"
          echo "${STITCH_ROOT}"

          echo
          echo "Stitch files:"
          find "${STITCH_ROOT}" -maxdepth 3 -type f | sort

          echo "STITCH_ROOT=${STITCH_ROOT}" >> "${GITHUB_ENV}"


      # =========================================================
      # 8. VERIFY IMPORTANT FILES
      # =========================================================
      - name: Verify Stitch files
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "jeevalokam_kerala_living_world/code.html"
            "kottaram_reality_distortion_tracker/code.html"
            "thakidu_folklore_warding_talismans/code.html"
            "rekhakal_archival_dossier_clues/code.html"
            "1974_inspect_evid_a/code.html"
            "1974_linked_to_deduction/code.html"
            "inspect_evid_b/code.html"
            "04_inspect_evid_c/code.html"
            "04_linked_to_deduction/code.html"
            "nilavilakku_ignited/code.html"
            "bio_acoustics_suppressed/code.html"
            "eyes_locked_front/code.html"
            "talisman_re_anchored/code.html"
            "machinpuram_attic_investigation/code.html"
            "linked_to_deduction/code.html"
            "tharavadu_exit_portal/code.html"
            "kerala_gothic_psychological_horror/DESIGN.md"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "${STITCH_ROOT}/${FILE}" ]; then
              echo
              echo "ERROR: Missing Stitch file:"
              echo "${FILE}"
              exit 1
            fi
          done

          echo
          echo "All required Stitch files are present."


      # =========================================================
      # 9. CREATE ANDROID PROJECT
      # =========================================================
      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android-build

          mkdir -p \
            android-build/app/src/main/assets \
            android-build/app/src/main/java/com/kottaram/shadows \
            android-build/app/src/main/res/values

          cp -R \
            "${STITCH_ROOT}/." \
            android-build/app/src/main/assets/

          echo
          echo "Android assets:"
          find android-build/app/src/main/assets \
            -maxdepth 4 \
            -type f \
            | sort


      # =========================================================
      # 10. SETTINGS
      # =========================================================
      - name: Create settings.gradle.kts
        shell: bash
        run: |
          cat > android-build/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  org.gradle.api.initialization.resolve.RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "KottaramShadowsOfKerala"

          include(":app")
          EOF


      # =========================================================
      # 11. ROOT GRADLE
      # =========================================================
      - name: Create root build.gradle.kts
        shell: bash
        run: |
          cat > android-build/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.1.1" apply false
          }
          EOF


      # =========================================================
      # 12. GRADLE PROPERTIES
      # =========================================================
      - name: Create gradle.properties
        shell: bash
        run: |
          cat > android-build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF


      # =========================================================
      # 13. APP GRADLE
      # =========================================================
      - name: Create app build.gradle.kts
        shell: bash
        run: |
          cat > android-build/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.kottaram.shadows"

              compileSdk = 36

              defaultConfig {
                  applicationId = "com.kottaram.shadows"

                  minSdk = 24
                  targetSdk = 36

                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildTypes {

                  debug {
                      isDebuggable = true
                      isMinifyEnabled = false
                  }

                  release {
                      isDebuggable = false
                      isMinifyEnabled = false
                  }
              }
          }
          EOF


      # =========================================================
      # 14. MANIFEST
      # =========================================================
      - name: Create AndroidManifest.xml
        shell: bash
        run: |
          cat > android-build/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="Kottaram: Shadows of Kerala"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # =========================================================
      # 15. THEME
      # =========================================================
      - name: Create styles.xml
        shell: bash
        run: |
          cat > android-build/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="@android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

                  <item name="android:statusBarColor">
                      #0F1418
                  </item>

                  <item name="android:navigationBarColor">
                      #0A0F13
                  </item>

                  <item name="android:windowBackground">
                      #0F1418
                  </item>

              </style>

          </resources>
          EOF


      # =========================================================
      # 16. MAIN ACTIVITY
      # =========================================================
      - name: Create MainActivity.java
        shell: bash
        run: |
          cat > android-build/app/src/main/java/com/kottaram/shadows/MainActivity.java <<'EOF'
          package com.kottaram.shadows;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              private static final String HOME_URL =
                  "file:///android_asset/" +
                  "jeevalokam_kerala_living_world/code.html";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  webView.setBackgroundColor(
                      Color.rgb(15, 20, 24)
                  );

                  webView.setOverScrollMode(
                      View.OVER_SCROLL_NEVER
                  );

                  WebSettings settings =
                      webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  settings.setMediaPlaybackRequiresUserGesture(
                      false
                  );

                  webView.setWebChromeClient(
                      new WebChromeClient()
                  );

                  webView.setWebViewClient(
                      new WebViewClient()
                  );

                  setContentView(webView);

                  webView.loadUrl(HOME_URL);
              }

              @Override
              public void onBackPressed() {

                  if (webView != null &&
                      webView.canGoBack()) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }
          }
          EOF


      # =========================================================
      # 17. VALIDATE GENERATED ANDROID PROJECT
      # =========================================================
      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          FILES=(
            "android-build/settings.gradle.kts"
            "android-build/build.gradle.kts"
            "android-build/gradle.properties"
            "android-build/app/build.gradle.kts"
            "android-build/app/src/main/AndroidManifest.xml"
            "android-build/app/src/main/java/com/kottaram/shadows/MainActivity.java"
            "android-build/app/src/main/res/values/styles.xml"
            "android-build/app/src/main/assets/jeevalokam_kerala_living_world/code.html"
          )

          for FILE in "${FILES[@]}"; do

              if [ ! -f "${FILE}" ]; then
                  echo
                  echo "ERROR: Android project file missing:"
                  echo "${FILE}"
                  exit 1
              fi

          done

          echo
          echo "Android project validation: PASS"


      # =========================================================
      # 18. GRADLE 9.3.1
      # =========================================================
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"


      # =========================================================
      # 19. VERIFY GRADLE
      # =========================================================
      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          gradle --version


      # =========================================================
      # 20. BUILD APK
      # =========================================================
      - name: Build Debug APK
        working-directory: android-build
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting Android build..."

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

          echo
          echo "Gradle build command completed."


      # =========================================================
      # 21. VERIFY APK
      #
      # FIXED PATH:
      # android-build/app/build/...
      # =========================================================
      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="android-build/app/build/outputs/apk/debug"

          echo "Looking for APK in:"
          echo "${APK_DIR}"

          if [ ! -d "${APK_DIR}" ]; then

              echo
              echo "ERROR: APK output directory does not exist."
              echo
              echo "Available build directories:"
              find android-build/app -maxdepth 8 \
                -type d \
                | sort

              echo
              echo "Available build files:"
              find android-build/app -maxdepth 10 \
                -type f \
                | sort

              exit 1
          fi

          APK_FILES=(
              "${APK_DIR}"/*.apk
          )

          if [ ! -f "${APK_FILES[0]}" ]; then

              echo
              echo "ERROR: No APK file was generated."

              echo
              echo "Available files:"
              find android-build/app/build \
                -type f \
                | sort

              exit 1
          fi

          echo
          echo "=========================================="
          echo "APK GENERATED SUCCESSFULLY"
          echo "=========================================="

          ls -lh "${APK_DIR}"/*.apk


      # =========================================================
      # 22. RENAME APK
      # =========================================================
      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="android-build/app/build/outputs/apk/debug"

          SOURCE_APK="$(find "${APK_DIR}" -maxdepth 1 -type f -name '*.apk' | head -n 1)"

          if [ -z "${SOURCE_APK}" ]; then
              echo "ERROR: APK not found."
              exit 1
          fi

          cp "${SOURCE_APK}" \
            "${APK_DIR}/Kottaram-Shadows-of-Kerala-Debug.apk"

          echo
          echo "Final APK:"
          ls -lh \
            "${APK_DIR}/Kottaram-Shadows-of-Kerala-Debug.apk"


      # =========================================================
      # 23. UPLOAD APK
      # =========================================================
      - name: Upload Kottaram APK
        uses: actions/upload-artifact@v4
        with:
          name: kottaram-debug-apk
          path: android-build/app/build/outputs/apk/debug/Kottaram-Shadows-of-Kerala-Debug.apk
          if-no-files-found: error
          retention-days: 7
