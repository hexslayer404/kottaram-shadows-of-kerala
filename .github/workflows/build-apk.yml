name: Build Kottaram APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK from Stitch ZIP
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # ---------------------------------------------------------
      # 2. Java 17
      # ---------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------
      # 3. Find and extract YOUR exact ZIP
      # ---------------------------------------------------------
      - name: Extract Stitch project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./stitch_kottaram_shadows_of_kerala.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found in repository root."
            echo "Files in repository:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf _stitch
          mkdir -p _stitch

          unzip -q "$ZIP_FILE" -d _stitch

          FIRST_HTML="$(find _stitch -type f -name 'code.html' | head -n 1)"

          if [ -z "$FIRST_HTML" ]; then
            echo "ERROR: No code.html files were found inside the ZIP."
            exit 1
          fi

          STITCH_ROOT="$(dirname "$(dirname "$FIRST_HTML")")"

          echo "Stitch root: $STITCH_ROOT"

          echo "ZIP CONTENT:"
          find "$STITCH_ROOT" -maxdepth 2 -type f | sort

          echo "STITCH_ROOT=$STITCH_ROOT" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 4. Create Android project dynamically
      # ---------------------------------------------------------
      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android-build

          mkdir -p android-build
          mkdir -p android-build/app/src/main/java/com/kottaram/shadows
          mkdir -p android-build/app/src/main/res/values
          mkdir -p android-build/app/src/main/assets/pages

          # Copy EVERYTHING from the Stitch ZIP
          cp -R "$STITCH_ROOT"/. android-build/app/src/main/assets/pages/

          echo "Copied Stitch files:"
          find android-build/app/src/main/assets/pages -maxdepth 2 -type f | sort

      # ---------------------------------------------------------
      # 5. settings.gradle.kts
      # ---------------------------------------------------------
      - name: Create Gradle settings
        shell: bash
        run: |
          cat > android-build/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "KottaramShadowsOfKerala"
          include(":app")
          EOF

      # ---------------------------------------------------------
      # 6. Root build.gradle.kts
      # ---------------------------------------------------------
      - name: Create root Gradle build
        shell: bash
        run: |
          cat > android-build/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.1.1" apply false
          }
          EOF

      # ---------------------------------------------------------
      # 7. gradle.properties
      # ---------------------------------------------------------
      - name: Create gradle.properties
        shell: bash
        run: |
          cat > android-build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      # ---------------------------------------------------------
      # 8. Android app build.gradle.kts
      # ---------------------------------------------------------
      - name: Create app Gradle file
        shell: bash
        run: |
          cat > android-build/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.kottaram.shadows"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.kottaram.shadows"
                  minSdk = 24
                  targetSdk = 36

                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildTypes {
                  debug {
                      isMinifyEnabled = false
                  }

                  release {
                      isMinifyEnabled = false
                  }
              }
          }
          EOF

      # ---------------------------------------------------------
      # 9. AndroidManifest.xml
      # ---------------------------------------------------------
      - name: Create Android manifest
        shell: bash
        run: |
          cat > android-build/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="Kottaram: Shadows of Kerala"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # ---------------------------------------------------------
      # 10. App theme
      # ---------------------------------------------------------
      - name: Create Android theme
        shell: bash
        run: |
          cat > android-build/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#EEC14B</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0F1418</item>
                  <item name="android:navigationBarColor">#0A0F13</item>
                  <item name="android:windowBackground">#0F1418</item>
              </style>

          </resources>
          EOF

      # ---------------------------------------------------------
      # 11. MainActivity.java
      # ---------------------------------------------------------
      - name: Create MainActivity
        shell: bash
        run: |
          cat > android-build/app/src/main/java/com/kottaram/shadows/MainActivity.java <<'EOF'
          package com.kottaram.shadows;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              private static final String HOME_URL =
                      "file:///android_asset/pages/jeevalokam_kerala_living_world/code.html";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  webView.setBackgroundColor(Color.rgb(15, 20, 24));
                  webView.setOverScrollMode(View.OVER_SCROLL_NEVER);

                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setDatabaseEnabled(true);
                  webView.getSettings().setAllowFileAccess(true);
                  webView.getSettings().setAllowContentAccess(true);
                  webView.getSettings().setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebChromeClient(new WebChromeClient());

                  webView.setWebViewClient(new WebViewClient() {

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request) {
                          return false;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);

                          injectNavigation();
                      }
                  });

                  setContentView(webView);

                  webView.loadUrl(HOME_URL);
              }

              private void injectNavigation() {

                  String javascript =
                          "javascript:(function() {" +
                          "const routes = {" +
                          "'jeevalokam':'jeevalokam_kerala_living_world'," +
                          "'kottaram-tracker':'kottaram_reality_distortion_tracker'," +
                          "'rekhakal':'rekhakal_archival_dossier_clues'," +
                          "'thakidu':'thakidu_folklore_warding_talismans'" +
                          "};" +

                          "document.querySelectorAll('a[data-path]').forEach(function(a) {" +
                          "if (a.dataset.kottaramBound === '1') return;" +
                          "a.dataset.kottaramBound = '1';" +

                          "a.addEventListener('click', function(e) {" +
                          "const path = this.getAttribute('data-path');" +
                          "if (routes[path]) {" +
                          "e.preventDefault();" +
                          "e.stopPropagation();" +
                          "location.href = 'file:///android_asset/pages/' +" +
                          "routes[path] + '/code.html';" +
                          "}" +
                          "}, true);" +
                          "});" +
                          "})();";

                  webView.evaluateJavascript(javascript, null);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      # ---------------------------------------------------------
      # 12. Verify project
      # ---------------------------------------------------------
      - name: Verify generated Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID PROJECT:"
          find android-build -maxdepth 6 -type f | sort

          test -f android-build/settings.gradle.kts
          test -f android-build/build.gradle.kts
          test -f android-build/app/build.gradle.kts
          test -f android-build/app/src/main/AndroidManifest.xml
          test -f android-build/app/src/main/java/com/kottaram/shadows/MainActivity.java
          test -f android-build/app/src/main/assets/pages/jeevalokam_kerala_living_world/code.html

          echo "Android project verification: OK"

      # ---------------------------------------------------------
      # 13. Setup Android SDK
      # ---------------------------------------------------------
      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ---------------------------------------------------------
      # 14. Install exact Gradle version
      # ---------------------------------------------------------
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      # ---------------------------------------------------------
      # 15. Build APK
      # ---------------------------------------------------------
      - name: Build Debug APK
        working-directory: android-build
        shell: bash
        run: |
          set -euo pipefail

          gradle --version

          gradle assembleDebug --stacktrace --no-daemon

      # ---------------------------------------------------------
      # 16. Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kottaram-debug-apk
          path: android-build/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
