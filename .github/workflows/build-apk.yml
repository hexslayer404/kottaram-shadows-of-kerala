name: Build Kottaram APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.3.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  ZIP_FILE: "stitch_kottaram_shadows_of_kerala.zip"

jobs:
  build:
    name: Build Kottaram Android APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v7


      # =========================================================
      # 2. JAVA 17
      # =========================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # =========================================================
      # 3. ANDROID SDK COMMAND LINE TOOLS
      #
      # IMPORTANT:
      # Do NOT put multiple packages on separate YAML lines.
      # We intentionally install only platform-tools here.
      # Additional SDK packages are installed below with sdkmanager.
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools"
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"


      # =========================================================
      # 4. INSTALL REQUIRED ANDROID SDK PACKAGES
      # =========================================================
      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing Android SDK packages..."

          command -v sdkmanager

          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo
          echo "Android SDK packages installed successfully."


      # =========================================================
      # 5. VERIFY ANDROID TOOLCHAIN
      # =========================================================
      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "===== JAVA ====="
          java --version

          echo
          echo "===== SDKMANAGER ====="
          which sdkmanager
          sdkmanager --version

          echo
          echo "===== ADB ====="
          which adb
          adb --version

          echo
          echo "===== ANDROID SDK ROOT ====="
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"

          echo
          echo "===== REQUIRED SDK PACKAGES ====="
          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-36|build-tools;36.0.0" \
            || true


      # =========================================================
      # 6. VERIFY ZIP EXISTS
      # =========================================================
      - name: Verify Stitch ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository root:"
          ls -lah

          if [ ! -f "${ZIP_FILE}" ]; then
            echo
            echo "ERROR: ${ZIP_FILE} was not found in repository root."
            echo
            echo "Files actually present:"
            find . -maxdepth 3 -type f -print | sort
            exit 1
          fi

          echo
          echo "ZIP FOUND:"
          ls -lh "${ZIP_FILE}"

          echo
          echo "ZIP CONTENT:"
          unzip -l "${ZIP_FILE}"


      # =========================================================
      # 7. EXTRACT STITCH ZIP
      # =========================================================
      - name: Extract Stitch project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _stitch
          mkdir -p _stitch

          unzip -q "${ZIP_FILE}" -d _stitch

          echo
          echo "Extracted files:"
          find _stitch -maxdepth 4 -type f | sort

          FIRST_HTML="$(
            find _stitch \
              -type f \
              -name 'code.html' \
              -print \
            | head -n 1
          )"

          if [ -z "${FIRST_HTML}" ]; then
            echo
            echo "ERROR: No code.html file was found inside the ZIP."
            exit 1
          fi

          STITCH_ROOT="$(
            dirname \
              "$(dirname "${FIRST_HTML}")"
          )"

          echo
          echo "Detected Stitch root:"
          echo "${STITCH_ROOT}"

          echo "STITCH_ROOT=${STITCH_ROOT}" >> "${GITHUB_ENV}"


      # =========================================================
      # 8. VERIFY YOUR STITCH SCREENS
      # =========================================================
      - name: Verify Stitch screens
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "jeevalokam_kerala_living_world/code.html"
            "kottaram_reality_distortion_tracker/code.html"
            "thakidu_folklore_warding_talismans/code.html"
            "rekhakal_archival_dossier_clues/code.html"
            "1974_inspect_evid_a/code.html"
            "1974_linked_to_deduction/code.html"
            "inspect_evid_b/code.html"
            "04_inspect_evid_c/code.html"
            "04_linked_to_deduction/code.html"
            "nilavilakku_ignited/code.html"
            "bio_acoustics_suppressed/code.html"
            "eyes_locked_front/code.html"
            "talisman_re_anchored/code.html"
            "machinpuram_attic_investigation/code.html"
            "linked_to_deduction/code.html"
            "tharavadu_exit_portal/code.html"
            "kerala_gothic_psychological_horror/DESIGN.md"
          )

          echo "Checking required Stitch files..."

          for FILE in "${REQUIRED_FILES[@]}"; do

            if [ ! -f "${STITCH_ROOT}/${FILE}" ]; then
              echo
              echo "ERROR: Required file missing:"
              echo "${STITCH_ROOT}/${FILE}"
              exit 1
            fi

          done

          echo
          echo "All required Stitch files found."


      # =========================================================
      # 9. CREATE ANDROID PROJECT
      # =========================================================
      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android-build

          mkdir -p \
            android-build/app/src/main/assets \
            android-build/app/src/main/java/com/kottaram/shadows \
            android-build/app/src/main/res/values

          # Copy the complete Stitch project
          cp -R \
            "${STITCH_ROOT}/." \
            android-build/app/src/main/assets/

          echo
          echo "Android assets created:"
          find android-build/app/src/main/assets \
            -maxdepth 4 \
            -type f \
            | sort


      # =========================================================
      # 10. CREATE settings.gradle.kts
      # =========================================================
      - name: Create settings.gradle.kts
        shell: bash
        run: |
          cat > android-build/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  org.gradle.api.initialization.resolve.RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "KottaramShadowsOfKerala"

          include(":app")
          EOF


      # =========================================================
      # 11. CREATE ROOT build.gradle.kts
      # =========================================================
      - name: Create root build.gradle.kts
        shell: bash
        run: |
          cat > android-build/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.1.1" apply false
          }
          EOF


      # =========================================================
      # 12. CREATE gradle.properties
      # =========================================================
      - name: Create gradle.properties
        shell: bash
        run: |
          cat > android-build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF


      # =========================================================
      # 13. CREATE APP build.gradle.kts
      # =========================================================
      - name: Create app build.gradle.kts
        shell: bash
        run: |
          cat > android-build/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.kottaram.shadows"

              compileSdk = 36

              defaultConfig {
                  applicationId = "com.kottaram.shadows"

                  minSdk = 24
                  targetSdk = 36

                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildTypes {
                  debug {
                      isDebuggable = true
                      isMinifyEnabled = false
                  }

                  release {
                      isDebuggable = false
                      isMinifyEnabled = false
                  }
              }
          }
          EOF


      # =========================================================
      # 14. CREATE AndroidManifest.xml
      # =========================================================
      - name: Create AndroidManifest.xml
        shell: bash
        run: |
          cat > android-build/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="Kottaram: Shadows of Kerala"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # =========================================================
      # 15. CREATE APP THEME
      # =========================================================
      - name: Create styles.xml
        shell: bash
        run: |
          cat > android-build/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="@android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>

                  <item name="android:statusBarColor">
                      #0F1418
                  </item>

                  <item name="android:navigationBarColor">
                      #0A0F13
                  </item>

                  <item name="android:windowBackground">
                      #0F1418
                  </item>

              </style>

          </resources>
          EOF


      # =========================================================
      # 16. CREATE MainActivity.java
      # =========================================================
      - name: Create MainActivity.java
        shell: bash
        run: |
          cat > android-build/app/src/main/java/com/kottaram/shadows/MainActivity.java <<'EOF'
          package com.kottaram.shadows;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              private static final String HOME_URL =
                  "file:///android_asset/" +
                  "jeevalokam_kerala_living_world/code.html";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  webView.setBackgroundColor(
                      Color.rgb(15, 20, 24)
                  );

                  webView.setOverScrollMode(
                      View.OVER_SCROLL_NEVER
                  );

                  WebSettings settings =
                      webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  settings.setMediaPlaybackRequiresUserGesture(
                      false
                  );

                  webView.setWebChromeClient(
                      new WebChromeClient()
                  );

                  webView.setWebViewClient(
                      new WebViewClient()
                  );

                  setContentView(webView);

                  webView.loadUrl(HOME_URL);
              }

              @Override
              public void onBackPressed() {

                  if (webView != null &&
                      webView.canGoBack()) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }
          }
          EOF


      # =========================================================
      # 17. VALIDATE GENERATED PROJECT
      # =========================================================
      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED=(
            "android-build/settings.gradle.kts"
            "android-build/build.gradle.kts"
            "android-build/gradle.properties"
            "android-build/app/build.gradle.kts"
            "android-build/app/src/main/AndroidManifest.xml"
            "android-build/app/src/main/java/com/kottaram/shadows/MainActivity.java"
            "android-build/app/src/main/res/values/styles.xml"
            "android-build/app/src/main/assets/jeevalokam_kerala_living_world/code.html"
          )

          for FILE in "${REQUIRED[@]}"; do

            if [ ! -f "${FILE}" ]; then
              echo
              echo "ERROR: Generated Android file missing:"
              echo "${FILE}"
              exit 1
            fi

          done

          echo
          echo "Android project validation: PASS"


      # =========================================================
      # 18. SETUP GRADLE 9.3.1
      # =========================================================
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"


      # =========================================================
      # 19. VERIFY GRADLE
      # =========================================================
      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          gradle --version


      # =========================================================
      # 20. BUILD DEBUG APK
      # =========================================================
      - name: Build Debug APK
        working-directory: android-build
        shell: bash
        run: |
          set -euo pipefail

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain


      # =========================================================
      # 21. VERIFY APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          echo "Looking for APK..."

          if ! compgen -G "${APK_DIR}/*.apk" > /dev/null; then

              echo
              echo "ERROR: APK was not generated."
              echo
              echo "Build output:"
              find app/build -type f | sort

              exit 1
          fi

          echo
          echo "APK GENERATED SUCCESSFULLY:"
          ls -lh "${APK_DIR}"/*.apk


      # =========================================================
      # 22. UPLOAD APK
      # =========================================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kottaram-debug-apk
          path: android-build/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
